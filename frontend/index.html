<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/aicte-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>आवेदनसेतु | AvedanSetu — AICTE Approval Workflow & Compliance Portal</title>
    <meta name="description" content="आवेदनसेतु (AvedanSetu) — Unified AICTE approval workflow automation, institutional compliance passport, deadline management, EVC scheduling, document validity, and alert escalation platform." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('reguflow_theme');
          var theme = stored || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-brand-porcelain text-brand-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
