services:
  db:
    image: postgres:16-alpine
    container_name: reguflow_postgres
    restart: always
    environment:
      POSTGRES_USER: reguflow
      POSTGRES_PASSWORD: reguflow_secret
      POSTGRES_DB: reguflow360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reguflow -d reguflow360"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reguflow_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://reguflow:reguflow_secret@db:5432/reguflow360
      SECRET_KEY: supersecret_dev_key_change_in_production_reguflow360
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reguflow_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
